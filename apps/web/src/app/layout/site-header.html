<header [class]="styles.root">
  <div [class]="barStyles">
    @if (page.bar(); as bar) {
    <a
      [href]="page.urlOf(bar.back)"
      [class]="styles.back"
      [attr.aria-label]="bar.backLabel"
      (click)="back($event, bar.back)"
    >
      <app-icon [icon]="icons.faChevronLeft" />
      <span>{{ bar.label }}</span>
    </a>
    <div [class]="styles.nav">
      <ng-container [ngTemplateOutlet]="bar.actions" />
    </div>
    } @else {
    <a
      routerLink="/"
      [class]="styles.home"
      [attr.aria-label]="appName + ', Startseite'"
      (click)="search.close()"
    >
      <img src="/img/logo_weiss.png" alt="" [class]="whiteLogo" width="258" height="208" />
      <img src="/img/logo.png" alt="" [class]="darkLogo" width="258" height="208" />
    </a>

    @if (auth.isAuthenticated()) {
    <nav aria-label="Hauptnavigation">
      <ul [class]="styles.nav">
        <li>
          <a
            routerLink="/scores/new"
            routerLinkActive
            ariaCurrentWhenActive="page"
            [class]="styles.link"
            (click)="search.close()"
          >
            <app-icon [icon]="icons.faCirclePlus" label="Score erfassen" />
          </a>
        </li>
        <li>
          <a
            [routerLink]="['/profile', auth.username()]"
            routerLinkActive
            ariaCurrentWhenActive="page"
            [class]="styles.link"
            (click)="search.close()"
          >
            <app-icon [icon]="icons.faUser" label="Mein Profil" />
          </a>
        </li>
        <li>
          <button
            type="button"
            [class]="styles.link"
            aria-controls="user-search"
            [attr.aria-expanded]="search.open()"
            (click)="search.toggle()"
          >
            <app-icon [icon]="icons.faMagnifyingGlass" label="Suche" />
          </button>
        </li>
        <li>
          <a
            routerLink="/settings"
            routerLinkActive
            ariaCurrentWhenActive="page"
            [class]="styles.link"
            (click)="search.close()"
          >
            <app-icon [icon]="icons.faGear" label="Einstellungen" />
          </a>
        </li>
        @if (auth.isAdmin()) {
        <li>
          <a
            routerLink="/admin"
            routerLinkActive
            ariaCurrentWhenActive="page"
            [class]="styles.link"
            (click)="search.close()"
          >
            <app-icon [icon]="icons.faCrown" label="Admin" />
          </a>
        </li>
        }
      </ul>
    </nav>
    } }
  </div>
  @if (status(); as status) {
  <p [class]="status.styles" role="status">
    <span>
      <app-icon [icon]="status.syncing ? icons.faArrowsRotate : icons.faWifi" />{{ status.text }}
    </span>
  </p>
  }
</header>
