<app-page-title
  title="Score erfassen"
  description="Trage hier deine Leistungen im BSZZ Dojo ein."
/>

<app-section>
  <app-feedback-message [feedback]="feedback()" />
  <h2>Erfasse einen neuen Score</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field label="Bogenart:">
      <select appFieldControl formControlName="bowType">
        @for (bowType of bowTypes; track bowType.id) {
        <option [ngValue]="bowType.id">{{ bowType.name }}</option>
        }
      </select>
    </app-form-field>
    <app-form-field label="Scheibengrösse:">
      <select appFieldControl formControlName="targetSize">
        @for (size of targetSizes; track size) {
        <option [ngValue]="size">{{ size }}cm</option>
        }
      </select>
    </app-form-field>
    <app-checkbox-field
      label="Spot:"
      [checked]="form.controls.isSpot.value"
      (checkedChange)="form.controls.isSpot.setValue($event)"
    />
    <app-form-field label="Datum:">
      <input
        appFieldControl
        type="date"
        formControlName="shotOn"
        [max]="today"
        [min]="earliestDate"
      />
    </app-form-field>
    @for (field of numberFields; track field.name) {
    <app-form-field [label]="field.label">
      <input
        appFieldControl
        type="number"
        inputmode="numeric"
        min="0"
        [max]="field.max"
        [formControlName]="field.name"
      />
    </app-form-field>
    }
    <button type="submit" appButton [pending]="pending()">Speichern</button>
  </form>
</app-section>

@if (auth.isAdmin()) {
<app-section>
  <h2>Scheibe (Beta)</h2>
  <p [class]="leadStyles">
    Tippe auf die Scheibe, wo deine Pfeile getroffen haben. Mit zwei Fingern zoomen.
  </p>
  <app-target-canvas />
</app-section>
}
