<app-page-title
  title="Score erfassen"
  description="Trage hier deine Leistungen im BSZZ Dojo ein."
/>

<app-section>
  <h2>Erfasse einen neuen Score</h2>
  <app-tabs [tabs]="modes" [(selected)]="mode">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-form-field label="Bogenart:">
        <select appFieldControl formControlName="bowType">
          @for (bowType of bowTypes; track bowType.id) {
          <option [ngValue]="bowType.id">{{ bowType.name }}</option>
          }
        </select>
      </app-form-field>
      <app-form-field label="Scheibengrösse:">
        <select appFieldControl formControlName="targetSize">
          @for (size of targetSizes; track size) {
          <option [ngValue]="size">{{ size }}cm</option>
          }
        </select>
      </app-form-field>
      <app-checkbox-field
        label="Spot:"
        [checked]="form.controls.isSpot.value"
        (checkedChange)="form.controls.isSpot.setValue($event)"
      />
      <app-form-field label="Datum:">
        <input
          appFieldControl
          type="date"
          formControlName="shotOn"
          [max]="today"
          [min]="earliestDate"
        />
      </app-form-field>
      @for (field of numberFields(); track field.name) {
      <app-form-field [label]="field.label">
        <input
          appFieldControl
          type="number"
          inputmode="numeric"
          min="0"
          [max]="field.max"
          [formControlName]="field.name"
        />
      </app-form-field>
      } @if (mode() === 'target') {
      <app-form-field label="Anzahl Pfeile:" hint="Durch 3 teilbar: eine Passe hat 3 Pfeile.">
        <input
          appFieldControl
          type="number"
          inputmode="numeric"
          min="3"
          step="3"
          [max]="maxArrows"
          formControlName="arrows"
        />
      </app-form-field>
      @if (shots().length > 0) {
      <div [class]="targetStyles">
        <app-target-canvas
          [shots]="shots()"
          [selected]="selected()"
          [isSpot]="form.controls.isSpot.value"
          (placed)="place($event)"
        />
        <div>
          <app-score-sheet [points]="points()" [(selected)]="selected" />
          <p [class]="summaryStyles" aria-live="polite">
            <span>10er: {{ totals().tens }}</span>
            <span>9er: {{ totals().nines }}</span>
            <span>Total: {{ totals().result }}</span>
          </p>
        </div>
      </div>
      } }
      <button
        type="submit"
        appButton
        [pending]="pending()"
        [disabled]="mode() === 'target' && !complete()"
      >
        Speichern
      </button>
    </form>
  </app-tabs>
</app-section>
