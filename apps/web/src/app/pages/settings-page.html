<app-page-title title="Einstellungen" description="Konfiguriere dein BSZZ Dojo." />

<app-section>
  <app-feedback-message [feedback]="badgeFeedback()" />
  <h2>Auszeichnung anfordern</h2>
  <p [class]="styles.lead">
    Da ich keinen Zugriff auf SM/Clubturnier Titel oder Abzeichen habe, kannst du hier deine
    anfordern.
  </p>
  <form [formGroup]="badgeForm" (ngSubmit)="requestBadge()" novalidate>
    <app-form-field label="Name:">
      <input
        appFieldControl
        formControlName="name"
        placeholder="bsp: Chlausschüsse 2023"
        [maxLength]="badgeNameMaxLength"
      />
    </app-form-field>
    <app-form-field label="Platzierung:">
      <select appFieldControl formControlName="place">
        @for (place of places; track place.value) {
        <option [ngValue]="place.value">{{ place.label }}</option>
        }
      </select>
    </app-form-field>
    <button type="submit" appButton [pending]="badgePending()">Anfordern</button>
  </form>
</app-section>

<app-section>
  <app-feedback-message [feedback]="profileFeedback()" />
  <h2>Profil bearbeiten</h2>
  <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" novalidate>
    <app-form-field label="Benutzername:" hint="Zum Einloggen. Ohne Leerzeichen.">
      <input
        appFieldControl
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        [maxLength]="limits.USERNAME_MAX_LENGTH"
      />
    </app-form-field>
    <app-form-field
      label="Anzeigename (optional):"
      hint="Wird statt des Benutzernamens angezeigt. Leer für keinen."
    >
      <input
        appFieldControl
        formControlName="displayName"
        autocomplete="name"
        [maxLength]="limits.DISPLAY_NAME_MAX_LENGTH"
      />
    </app-form-field>
    <app-form-field label="Neues Passwort:" hint="Leer lassen, um es nicht zu ändern.">
      <input
        appFieldControl
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [maxLength]="limits.PASSWORD_MAX_LENGTH"
      />
    </app-form-field>
    @if (needsCurrentPassword()) {
    <app-form-field label="Aktuelles Passwort:" hint="Nötig, um das Passwort zu ändern.">
      <input
        appFieldControl
        type="password"
        formControlName="currentPassword"
        autocomplete="current-password"
        [maxLength]="limits.PASSWORD_MAX_LENGTH"
      />
    </app-form-field>
    }
    <button type="submit" appButton [pending]="profilePending()">Speichern</button>
  </form>
</app-section>

<app-section>
  <h2>Settings</h2>
  <app-checkbox-field
    label="Light Theme:"
    [checked]="settings.theme() === 'light'"
    (checkedChange)="settings.setTheme($event ? 'light' : 'dark')"
  />
  @if (settings.saveStatus() === 'error') {
  <app-feedback-message [feedback]="themeError" />
  }
</app-section>

<app-section>
  <h2>Ausloggen</h2>
  <p [class]="styles.lead">Möchtest du dich wirklich ausloggen?</p>
  <button type="button" appButton [pending]="loggingOut()" (click)="logout()">Logout</button>
</app-section>
