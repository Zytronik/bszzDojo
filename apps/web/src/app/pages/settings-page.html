<app-page-title title="Einstellungen" description="Konfiguriere dein BSZZ Dojo." />

<app-badges-section />

<app-section>
  <h2>Profil bearbeiten</h2>
  <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" novalidate>
    <app-form-field label="Benutzername:" hint="Zum Einloggen. Ohne Leerzeichen.">
      <input
        appFieldControl
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        [maxLength]="limits.USERNAME_MAX_LENGTH"
      />
    </app-form-field>
    <app-form-field label="Anzeigename (optional):" hint="Wird statt des Benutzernamens angezeigt.">
      <input
        appFieldControl
        formControlName="displayName"
        autocomplete="name"
        [maxLength]="limits.DISPLAY_NAME_MAX_LENGTH"
      />
    </app-form-field>
    <app-form-field label="Abzeichen:">
      <div [class]="rankRowStyles">
        <select appFieldControl formControlName="rank">
          <option [ngValue]="null">Keines</option>
          @for (rank of ranks; track rank.id) {
          <option [ngValue]="rank.id">{{ rank.name }}</option>
          }
        </select>
        @if (selectedRank(); as rankId) {
        <app-rank-badge [rankId]="rankId" />
        }
      </div>
    </app-form-field>
    <app-form-field label="Neues Passwort:" hint="Leer lassen, um es nicht zu ändern.">
      <input
        appFieldControl
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [maxLength]="limits.PASSWORD_MAX_LENGTH"
      />
    </app-form-field>
    @if (needsCurrentPassword()) {
    <app-form-field label="Aktuelles Passwort:" hint="Nötig, um das Passwort zu ändern.">
      <input
        appFieldControl
        type="password"
        formControlName="currentPassword"
        autocomplete="current-password"
        [maxLength]="limits.PASSWORD_MAX_LENGTH"
      />
    </app-form-field>
    }
    <button type="submit" appButton [pending]="profilePending()">Speichern</button>
  </form>
</app-section>

<app-section>
  <h2>Settings</h2>
  <app-checkbox-field
    label="Light Theme:"
    [checked]="settings.theme() === 'light'"
    (checkedChange)="settings.setTheme($event ? 'light' : 'dark')"
  />
</app-section>

@if (install.canInstall()) {
<app-section>
  <h2>App installieren</h2>
  <p [class]="leadStyles">Speichere das BSZZ Dojo als App auf deinem Startbildschirm.</p>
  <button type="button" appButton (click)="install.show()">Anleitung anzeigen</button>
</app-section>
}

<app-section>
  <h2>Ausloggen</h2>
  <p [class]="leadStyles">Möchtest du dich wirklich ausloggen?</p>
  <button type="button" appButton [pending]="loggingOut()" (click)="logout()">Logout</button>
</app-section>
