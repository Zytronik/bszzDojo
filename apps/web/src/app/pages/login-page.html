<app-page-title
  title="Willkommen im"
  titleSecondLine="BSZZ Dojo"
  description="Bitte logge dich ein oder registriere dich, um das BSZZ Dojo zu betreten."
/>

<app-section>
  <app-tabs [tabs]="tabs" [selected]="tab()" (selectedChange)="selectTab($event)">
    <app-feedback-message [feedback]="feedback()" />

    @if (isTab('login')) {
    <h2>Einloggen</h2>
    <form [formGroup]="login" (ngSubmit)="submitLogin()">
      <div [class]="styles.field.root">
        <label for="login-username" [class]="styles.field.label">Benutzername:</label>
        <input
          id="login-username"
          [class]="styles.input"
          formControlName="username"
          autocomplete="username"
          autocapitalize="none"
          [maxLength]="limits.USERNAME_MAX_LENGTH"
        />
      </div>
      <div [class]="styles.field.root">
        <label for="login-password" [class]="styles.field.label">Passwort:</label>
        <input
          id="login-password"
          type="password"
          [class]="styles.input"
          formControlName="password"
          autocomplete="current-password"
          [maxLength]="limits.PASSWORD_MAX_LENGTH"
        />
      </div>
      <button type="submit" [class]="styles.button" [disabled]="auth.pending()">Einloggen</button>
    </form>
    <a routerLink="/forgot-password" [class]="styles.bottomLink">Passwort vergessen?</a>
    } @else {
    <h2>Registrieren</h2>
    <form [formGroup]="register" (ngSubmit)="submitRegister()">
      <div [class]="styles.field.root">
        <label for="register-username" [class]="styles.field.label">Benutzername:</label>
        <input
          id="register-username"
          [class]="styles.input"
          formControlName="username"
          autocomplete="username"
          [maxLength]="limits.USERNAME_MAX_LENGTH"
        />
      </div>
      <div [class]="styles.field.root">
        <label for="register-email" [class]="styles.field.label">E-Mail:</label>
        <input
          id="register-email"
          type="email"
          [class]="styles.input"
          formControlName="email"
          autocomplete="email"
          [maxLength]="limits.EMAIL_MAX_LENGTH"
        />
      </div>
      <div [class]="styles.field.root">
        <label for="register-password" [class]="styles.field.label">Passwort:</label>
        <input
          id="register-password"
          type="password"
          [class]="styles.input"
          formControlName="password"
          autocomplete="new-password"
          [maxLength]="limits.PASSWORD_MAX_LENGTH"
        />
        <span [class]="styles.field.hint">Mindestens {{ limits.PASSWORD_MIN_LENGTH }} Zeichen</span>
      </div>
      <button type="submit" [class]="styles.button" [disabled]="auth.pending()">
        Registrieren
      </button>
    </form>
    }
  </app-tabs>
</app-section>
