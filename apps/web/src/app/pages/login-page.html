<app-page-title
  title="Willkommen im"
  titleSecondLine="BSZZ Dojo"
  description="Bitte logge dich ein oder registriere dich, um das BSZZ Dojo zu betreten."
/>

<app-section>
  <app-tabs [tabs]="tabs" [(selected)]="tab">
    @if (isTab('login')) {
    <h2>Einloggen</h2>
    <form [formGroup]="login" (ngSubmit)="submitLogin()" novalidate>
      <app-form-field label="Benutzername:">
        <input
          appFieldControl
          formControlName="username"
          autocomplete="username"
          autocapitalize="none"
          [maxLength]="limits.USERNAME_MAX_LENGTH"
        />
      </app-form-field>
      <app-form-field label="Passwort:">
        <input
          appFieldControl
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [maxLength]="limits.PASSWORD_MAX_LENGTH"
        />
      </app-form-field>
      <button type="submit" appButton [pending]="auth.pending()">Einloggen</button>
    </form>
    } @else {
    <h2>Registrieren</h2>
    <form [formGroup]="register" (ngSubmit)="submitRegister()" novalidate>
      <app-form-field label="Benutzername:" hint="Zum Einloggen. Ohne Leerzeichen.">
        <input
          appFieldControl
          formControlName="username"
          autocomplete="username"
          autocapitalize="none"
          [maxLength]="limits.USERNAME_MAX_LENGTH"
        />
      </app-form-field>
      <app-form-field
        label="Anzeigename:"
        hint="Optional. Wird statt des Benutzernamens angezeigt."
      >
        <input
          appFieldControl
          formControlName="displayName"
          autocomplete="name"
          [maxLength]="limits.DISPLAY_NAME_MAX_LENGTH"
        />
      </app-form-field>
      <app-form-field
        label="Passwort:"
        [hint]="'Mindestens ' + limits.PASSWORD_MIN_LENGTH + ' Zeichen'"
      >
        <input
          appFieldControl
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [maxLength]="limits.PASSWORD_MAX_LENGTH"
        />
      </app-form-field>
      <button type="submit" appButton [pending]="auth.pending()">Registrieren</button>
    </form>
    }
  </app-tabs>
</app-section>
