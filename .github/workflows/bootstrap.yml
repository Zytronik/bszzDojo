# Temporary: installs dependencies for a sandbox without npm registry access. Removed before merging.
name: Bootstrap deps

on:
  push:
    branches: [feat/rewrite-monorepo]
    paths: ['**/package.json', '.github/workflows/bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          set -o pipefail
          if ! npm install --no-audit --no-fund 2>&1 | tee /tmp/install.log; then
            echo "::warning::npm $(npm -v) failed, retrying with npm 11"
            rm -rf node_modules package-lock.json
            npx -y npm@11 install --no-audit --no-fund 2>&1 | tee /tmp/install.log
            echo "::warning::installed with npm 11"
          fi
      - name: Report install errors
        if: failure()
        run: grep -E 'npm (error|ERR)' /tmp/install.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Publish as draft release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf /tmp/workspace-deps.tgz package-lock.json node_modules $(ls -d apps/*/node_modules packages/*/node_modules 2>/dev/null)
          ls -lh /tmp/workspace-deps.tgz
          gh release delete deps-bootstrap --yes --cleanup-tag 2>/dev/null || true
          gh release create deps-bootstrap /tmp/workspace-deps.tgz --draft --title "deps bootstrap (temporary)" --notes "${GITHUB_SHA}" --target "${GITHUB_SHA}"
